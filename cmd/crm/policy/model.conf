# Casbin RBAC modeli (cmd/crm).
# sub: rol (web.ExtractUserRole; oturum yoksa "guest"), obj: istek yolu, act: HTTP metodu.
# g satırları rol kalıtımıdır: admin, user'ın; user, guest'in tüm izinlerini alır.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
